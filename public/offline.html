<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f1ea">
  <title>Guyscompany</title>
  <link rel="icon" href="/favicon.svg">
  <style>
    :root { color-scheme: light dark; --bg: #f6f1ea; --ink: #2a241d; --muted: #7a6f62; --brand: #f07a2a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #15130f; --ink: #f3ece2; --muted: #a99d8e; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
      font-family: Vazirmatn, Inter, system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; text-align: center; }
    main { max-width: 360px; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 1.25rem; margin: 16px 0 4px; }
    p { margin: 0; color: var(--muted); line-height: 1.7; }
    .en { margin-top: 20px; }
    button { margin-top: 24px; min-height: 44px; padding: 0 24px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/favicon.svg" alt="">
    <h1>اتصال به اینترنت برقرار نیست</h1>
    <p>برای دیدن داشبورد و دفتر به اینترنت وصل شوید.</p>
    <div class="en" dir="ltr" lang="en">
      <h1>You're offline</h1>
      <p>Connect to the internet to open the dashboard and the office.</p>
    </div>
    <button type="button" onclick="location.reload()">تلاش دوباره · Try again</button>
  </main>
  <script>addEventListener('online', () => location.reload());</script>
</body>
</html>
